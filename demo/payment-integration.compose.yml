# Isolated, disposable services for the local Payment Integration walkthrough.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: openfednow
      POSTGRES_USER: openfednow
      POSTGRES_PASSWORD: openfednow
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfednow -d openfednow"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports: ["127.0.0.1:55672:5672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
