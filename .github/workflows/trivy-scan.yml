name: Dependency Vulnerability Scan

# Scan Maven dependencies without an NVD API key. HIGH/CRITICAL findings fail
# the job; no vulnerability suppressions are carried over from the old scanner.
on:
  schedule:
    - cron: "0 4 * * 1"
  pull_request:
    branches: [ main ]
    paths:
      - "pom.xml"
      - ".github/workflows/trivy-scan.yml"
      - ".trivyignore*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan for known vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Resolve Maven dependencies
        run: mvn -B dependency:resolve --no-transfer-progress

      - name: Scan dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.74.0'
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: json
          output: trivy-results.json
          severity: HIGH,CRITICAL
          exit-code: '1'
          timeout: 10m

      - name: Convert results to SARIF
        if: always() && hashFiles('trivy-results.json') != ''
        run: trivy convert --format sarif --output trivy-results.sarif trivy-results.json

      - name: Upload SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-vulnerability-report
          path: |
            trivy-results.json
            trivy-results.sarif
          if-no-files-found: warn
