name: Dependency Vulnerability Scan

# Two scans, because they see different things. The filesystem scan reads
# pom.xml and catches declared dependencies. The image scan reads the jars that
# are actually shipped, so it also sees transitive dependencies and the base
# image's OS packages. HIGH/CRITICAL findings fail either job. Scoped
# exceptions, with their justifications, are in .trivyignore.
on:
  schedule:
    - cron: "0 4 * * 1"
  pull_request:
    branches: [ main ]
    paths:
      - "pom.xml"
      - "Dockerfile"
      - ".dockerignore"
      - "compose.app.yml"
      - ".github/workflows/trivy-scan.yml"
      - ".trivyignore*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan for known vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Resolve Maven dependencies
        run: mvn -B dependency:resolve --no-transfer-progress

      - name: Scan dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.74.0'
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: json
          output: trivy-results.json
          severity: HIGH,CRITICAL
          exit-code: '1'
          timeout: 10m

      - name: Convert results to SARIF
        if: always() && hashFiles('trivy-results.json') != ''
        run: trivy convert --format sarif --output trivy-results.sarif trivy-results.json

      - name: Upload SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          # Distinct category per scan, or one upload overwrites the other.
          category: trivy-filesystem

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-vulnerability-report
          path: |
            trivy-results.json
            trivy-results.sarif
          if-no-files-found: warn

  image-scan:
    name: Scan the container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      TRIVY_VERSION: '0.74.0'
      PLATFORMS: linux/amd64,linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # One layout per platform: Trivy cannot pick a platform out of a
      # multi-platform layout and would scan amd64 twice.
      - name: Build the linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          outputs: type=oci,dest=image-layout-amd64,tar=false
          cache-from: type=gha,scope=image-amd64
          cache-to: type=gha,mode=max,scope=image-amd64

      - name: Build the linux/arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          outputs: type=oci,dest=image-layout-arm64,tar=false
          cache-from: type=gha,scope=image-arm64
          cache-to: type=gha,mode=max,scope=image-arm64

      - name: Scan each platform
        run: |
          set -euo pipefail
          status=0
          for platform in ${PLATFORMS//,/ }; do
            arch="${platform##*/}"
            echo "::group::$platform"
            # Keeps going across platforms so one report is not hidden by the
            # other. The script also fails if a scan looked at the wrong
            # architecture.
            .github/scripts/scan-image-layout.sh "image-layout-${arch}" "$arch" \
              "sbom-${arch}.cdx.json" "trivy-image-${arch}.sarif" || status=1
            echo "::endgroup::"
          done
          exit "$status"

      - name: Upload SARIF for linux/amd64
        if: always() && hashFiles('trivy-image-amd64.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image-amd64.sarif
          category: trivy-image-amd64

      - name: Upload SARIF for linux/arm64
        if: always() && hashFiles('trivy-image-arm64.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image-arm64.sarif
          category: trivy-image-arm64

      - name: Upload image vulnerability report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-vulnerability-report
          path: trivy-image-*.sarif
          if-no-files-found: warn
