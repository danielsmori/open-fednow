name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean compile --no-transfer-progress

      - name: Run unit tests
        # Runs the default test suite. Integration tests (tagged "integration") require
        # Testcontainers / Docker and are excluded here — see the integration-tests job
        # below. Run integration tests locally with: mvn test -Dgroups=integration -DexcludedGroups=
        run: mvn -B test --no-transfer-progress

      - name: Run Banking Hub preflight tests
        run: python3 -m unittest discover -s scripts -p 'test_fiserv_trial_preflight.py'

      - name: Run clean-checkout preflight tests
        run: python3 -m unittest discover -s scripts -p 'test_preflight.py'

      - name: Check the clean-checkout preflight runs
        # The runner has JDK 17, Maven, Python and Docker, so the documented
        # preflight must pass here; a non-zero status means the documented
        # clean-checkout path is broken.
        run: python3 scripts/preflight.py

      - name: Run portable reliability profile tests
        run: python3 -m unittest discover -s harness -p 'test_portable_profile.py'

      - name: Check S02 comparison and smoke run
        run: |
          python3 -m unittest discover -s harness -p 'test_s02_comparison.py'
          python3 harness/compare_s02.py --mode python --trials 1 --output target/s02-comparison/ci-quick.json

      - name: Check reference target guards
        run: python3 -m unittest discover -s harness -p 'test_reference_target_guards.py'

      - name: Smoke test portable send profile
        run: python3 harness/smoke_profile.py --case S02 --output target/portable/ci-smoke.json

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: target/surefire-reports/

  integration-tests:
    name: Integration Tests (Testcontainers)
    runs-on: ubuntu-latest
    # Run after unit tests so a unit-test break fails fast and doesn't burn the
    # slower integration runner.
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # The shared infrastructure lives for the test JVM. Each class closes its
      # Spring context before the next class starts; no cross-run reuse is needed.
      - name: Verify Docker availability
        run: docker version

      - name: Run integration tests
        env:
          # Skip Ryuk because GitHub runners already clean up the VM after the
          # job finishes, and Ryuk occasionally fails on the first container
          # creation on a cold runner.
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: mvn -B test -Dgroups=integration -DexcludedGroups= --no-transfer-progress

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: target/surefire-reports/

  tigerbeetle-s16:
    name: TigerBeetle Synthetic S16
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pinned local experiment dependencies
        run: |
          python -m venv target/tigerbeetle/.venv
          target/tigerbeetle/.venv/bin/python -m pip install -r harness/requirements-tigerbeetle.txt
          curl -fL -o target/tigerbeetle/tigerbeetle-x86_64-linux.zip \
            https://github.com/tigerbeetle/tigerbeetle/releases/download/0.17.9/tigerbeetle-x86_64-linux.zip
          unzip -q target/tigerbeetle/tigerbeetle-x86_64-linux.zip -d target/tigerbeetle

      - name: Check ledger result handling
        run: target/tigerbeetle/.venv/bin/python -m unittest discover -s harness -p 'test_tigerbeetle_ledger.py'

      - name: Run unchanged S16 and pending contention
        run: target/tigerbeetle/.venv/bin/python harness/smoke_tigerbeetle.py --binary target/tigerbeetle/tigerbeetle --output target/tigerbeetle/ci-s16.json

      - name: Check settlement and rejection
        run: target/tigerbeetle/.venv/bin/python harness/smoke_tigerbeetle.py --binary target/tigerbeetle/tigerbeetle --case S01 --output target/tigerbeetle/ci-s01.json

      - name: Upload synthetic reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tigerbeetle-synthetic-reports
          path: target/tigerbeetle/ci-*.json

  container-image:
    name: Container Image
    runs-on: ubuntu-latest
    # Build the image only once the unit tests pass, so a code break fails on
    # the cheaper job first.
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: openfednow:ci
          build-args: |
            VERSION=ci-${{ github.sha }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the runtime layer is non-root and has no build tools
        run: |
          set -euo pipefail
          user="$(docker image inspect openfednow:ci --format '{{.Config.User}}')"
          if [ "$user" != "1000:1000" ]; then
            echo "image user is '$user'; the Helm chart runs the pod as 1000" >&2
            exit 1
          fi
          docker run --rm --entrypoint sh openfednow:ci -c '
            set -eu
            [ "$(id -u)" = 1000 ] || { echo "container runs as uid $(id -u)" >&2; exit 1; }
            for tool in mvn javac jar; do
              if command -v "$tool" >/dev/null 2>&1; then
                echo "$tool reached the runtime layer" >&2
                exit 1
              fi
            done'

      - name: Start the backing services
        run: |
          set -euo pipefail
          docker network create openfednow-ci
          docker run -d --name ci-postgres --network openfednow-ci \
            -e POSTGRES_DB=openfednow -e POSTGRES_USER=openfednow -e POSTGRES_PASSWORD=openfednow \
            --health-cmd 'pg_isready -U openfednow -d openfednow' \
            --health-interval 2s --health-retries 30 \
            postgres:16-alpine
          docker run -d --name ci-redis --network openfednow-ci redis:7-alpine
          docker run -d --name ci-rabbitmq --network openfednow-ci rabbitmq:3-management-alpine
          .github/scripts/wait-for-health.sh ci-postgres 120

      - name: Start the image and wait for its healthcheck
        run: |
          set -euo pipefail
          docker run -d --name ci-app --network openfednow-ci -p 127.0.0.1:18080:8080 \
            -e DB_URL=jdbc:postgresql://ci-postgres:5432/openfednow \
            -e REDIS_HOST=ci-redis -e RABBITMQ_HOST=ci-rabbitmq \
            openfednow:ci
          .github/scripts/wait-for-health.sh ci-app

      - name: Check health routes and that the fixture gates are off
        run: |
          set -euo pipefail
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }

          health="$(code http://127.0.0.1:18080/fednow/health)"
          [ "$health" = 200 ] || { echo "/fednow/health returned $health" >&2; exit 1; }

          # The Helm chart probes these two paths, so a container that serves
          # them is one Kubernetes can schedule.
          for probe in liveness readiness; do
            status="$(code "http://127.0.0.1:18080/actuator/health/$probe")"
            [ "$status" = 200 ] || { echo "actuator $probe returned $status" >&2; exit 1; }
          done

          closed="$(code -u admin:changeme -X POST -H 'Content-Type: application/json' \
            -d '{}' http://127.0.0.1:18080/reference/v1/fixtures/accounts)"
          if [ "$closed" != 404 ]; then
            echo "the fixture route answered $closed by default; expected 404" >&2
            exit 1
          fi

      - name: Confirm that gate check can fail — same route, gate on
        run: |
          set -euo pipefail
          docker run -d --name ci-app-fixtures --network openfednow-ci -p 127.0.0.1:18081:8080 \
            -e DB_URL=jdbc:postgresql://ci-postgres:5432/openfednow \
            -e REDIS_HOST=ci-redis -e RABBITMQ_HOST=ci-rabbitmq \
            -e RELIABILITY_FIXTURE_API_ENABLED=true \
            openfednow:ci
          .github/scripts/wait-for-health.sh ci-app-fixtures
          opened="$(curl -s -o /dev/null -w '%{http_code}' -u admin:changeme -X POST \
            -H 'Content-Type: application/json' -d '{}' \
            http://127.0.0.1:18081/reference/v1/fixtures/accounts)"
          if [ "$opened" = 404 ]; then
            echo "still 404 with the gate on, so the default-off check proves nothing" >&2
            exit 1
          fi
          echo "fixture route answers $opened when explicitly enabled, 404 when not"

      - name: Application log on failure
        if: failure()
        run: docker logs --tail 200 ci-app || true

      - name: Tear down
        if: always()
        run: |
          docker rm -f ci-app ci-app-fixtures ci-postgres ci-redis ci-rabbitmq >/dev/null 2>&1 || true
          docker network rm openfednow-ci >/dev/null 2>&1 || true

  compose-app:
    name: Compose App Stack
    runs-on: ubuntu-latest
    # The image build is the slow part and the unit tests gate it, same as the
    # Container Image job.
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Preflight in app mode
        run: python3 scripts/preflight.py --mode app

      - name: The base file still publishes the backing services
        # The host-run workflow has to keep working untouched; app mode is an
        # addition, not a replacement.
        run: |
          set -euo pipefail
          published="$(docker compose -f docker-compose.yml config | grep -c 'published:')"
          if [ "$published" != 4 ]; then
            echo "the base file publishes $published host ports, expected 4" >&2
            exit 1
          fi

      - name: Start the app stack
        run: |
          docker compose -p ci-app-stack -f docker-compose.yml -f compose.app.yml \
            up -d --wait

      - name: Only the gateway publishes a port
        run: |
          set -euo pipefail
          for service in postgres redis rabbitmq; do
            id="$(docker compose -p ci-app-stack -f docker-compose.yml -f compose.app.yml ps -q "$service")"
            bindings="$(docker inspect -f '{{json .HostConfig.PortBindings}}' "$id")"
            if [ "$bindings" != '{}' ]; then
              echo "$service publishes $bindings in app mode; it should publish nothing" >&2
              exit 1
            fi
          done

          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          health="$(code http://127.0.0.1:8080/fednow/health)"
          [ "$health" = 200 ] || { echo "gateway health returned $health" >&2; exit 1; }

          closed="$(code -u admin:changeme -X POST -H 'Content-Type: application/json' \
            -d '{}' http://127.0.0.1:8080/reference/v1/fixtures/accounts)"
          if [ "$closed" != 404 ]; then
            echo "the fixture route answered $closed in app mode; expected 404" >&2
            exit 1
          fi

      - name: A second project runs alongside the first
        run: |
          set -euo pipefail
          APP_PORT=18080 docker compose -p ci-app-stack-2 -f docker-compose.yml -f compose.app.yml \
            up -d --wait
          for port in 8080 18080; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/fednow/health")"
            [ "$code" = 200 ] || { echo "the gateway on $port returned $code" >&2; exit 1; }
          done
          echo "two projects healthy at the same time, on 8080 and 18080"

      - name: Compose logs on failure
        if: failure()
        run: |
          docker compose -p ci-app-stack -f docker-compose.yml -f compose.app.yml logs --tail 120 app || true

      - name: Tear down
        # Only this job's own projects, and only volumes it created.
        if: always()
        run: |
          for project in ci-app-stack ci-app-stack-2; do
            docker compose -p "$project" -f docker-compose.yml -f compose.app.yml down -v >/dev/null 2>&1 || true
          done
