# Test-scope overrides — apply to every test that boots a Spring context.
#
# The main application.yml defaults to PostgreSQL (assuming docker-compose is
# up) so `mvn spring-boot:run` works with no env vars. Tests should not need
# Docker to boot the Spring context: this file swaps the datasource back to
# an H2 in-memory instance in Postgres-compat mode.
#
# @Tag("integration") tests that need real Postgres (see
# AbstractInfrastructureIntegrationTest) declare a @DynamicPropertySource that
# overrides these values at a higher priority — those keep working.
spring.datasource.url=jdbc:h2:mem:test-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Automatic reconciliation on core recovery (#68) is off for the test suite:
# integration tests share one Redis for the whole JVM, so a pending marker left
# by one test class would start a background reconciliation in the middle of
# another. Tests of the trigger enable it explicitly.
openfednow.reconciliation.auto-on-core-recovery=false

# The aggregate-window gauge sampler (#68) fires at context start and then on a
# fixed delay; a background sample mid-test could overwrite gauges a test is
# asserting on. Tests that cover it call sampleNow() directly.
openfednow.bridge-mode.metrics-sample-interval-seconds=3600
