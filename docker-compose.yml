# Local development environment for OpenFedNow
# Starts Redis (Shadow Ledger cache), RabbitMQ (async message queue), and
# Postgres (durable state: saga_state, idempotency_keys, reconciliation_run,
# admin_audit_log). Postgres is required for the app to accept real traffic
# — the idempotency writes use ON CONFLICT DO NOTHING, which H2 does not
# support even in Postgres-compat mode. The Kafka service is opt-in and
# only relevant when KAFKA_ENABLED=true; it's kept commented out below
# because bitnami/kafka:3.7 was removed from Docker Hub.
#
# Container and volume names are project-scoped: Compose derives them from the
# project name (the checkout directory, or -p / COMPOSE_PROJECT_NAME), so a
# second checkout can start its own stack without renaming or removing another
# project's containers.
#
# Host ports are published on the loopback interface (127.0.0.1) only, so
# these credentials-light dev services are not reachable from the network.
# Host ports are configurable; container ports are fixed. Each variable
# defaults to the service's standard port, so a plain `up` behaves as before.
# REDIS_PORT and RABBITMQ_PORT are the same names application.yml reads, so
# one export moves both the binding and the app's connection:
#   REDIS_PORT                host port for Redis        (default 6379)
#   RABBITMQ_PORT             host port for AMQP         (default 5672)
#   RABBITMQ_MANAGEMENT_PORT  host port for the mgmt UI  (default 15672)
#   POSTGRES_PORT             host port for Postgres     (default 5432)
# A second project alongside the first, e.g.:
#   REDIS_PORT=16379 RABBITMQ_PORT=15673 RABBITMQ_MANAGEMENT_PORT=25672 \
#   POSTGRES_PORT=15432 docker-compose -p openfednow-eval up -d
# Postgres has no app-side port variable; put POSTGRES_PORT into DB_URL.
#
# Usage:
#   docker-compose up -d        # start in background
#   docker-compose down         # stop and remove containers
#   docker-compose logs -f      # follow logs
#   docker-compose ps           # resolve the generated container names
#
# Address a container by service name rather than a fixed name, e.g.
#   docker-compose exec postgres psql -U openfednow -d openfednow
#
# Then launch the app with Postgres:
#   DB_URL=jdbc:postgresql://localhost:${POSTGRES_PORT:-5432}/openfednow \
#   DB_USERNAME=openfednow DB_PASSWORD=openfednow \
#   mvn spring-boot:run

services:

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"                # AMQP
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"   # Management UI — http://localhost:15672 by default (guest/guest)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: openfednow
      POSTGRES_USER: openfednow
      POSTGRES_PASSWORD: openfednow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfednow -d openfednow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka (optional) — event streaming bus alongside RabbitMQ. Only relevant
  # when KAFKA_ENABLED=true in the app. Kept commented out because
  # bitnami/kafka:3.7 was removed from Docker Hub; substitute
  # apache/kafka:3.7.0 (KRaft mode) or confluentinc/cp-kafka when needed.

volumes:
  redis-data:
  rabbitmq-data:
  postgres-data:
